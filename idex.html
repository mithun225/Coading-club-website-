
<!DOCTYPE html>
<html>
<head>
    <title>Coding Club</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
            background-color: #f2f2f2;
        }

        h1 {
            background-color: blue;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h2 {
            color: blue;
        }

        table {
            width: 100%;
            background-color: white;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: lightblue;
        }

        form {
            background-color: white;
            padding: 15px;
        }

        input {
            padding: 8px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <h1>Coding Club</h1>
    <p>Welcome to our Coding Club!</p>

    <h2>Upcoming Events</h2>

    <table>
        <tr>
            <th>Event</th>
            <th>Date</th>
        </tr>
        <tr>
            <td>Web Development</td>
            <td>25 October</td>
        </tr>
        <tr>
            <td>Coding Competition</td>
            <td>28 October</td>
        </tr>
    </table>

    <h2>Register Here</h2>

    <form>
        <label>Name:</label><br>
        <input type="text" placeholder="Enter your name">
        <br><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Enter your email">
        <br><br>

        <input type="submit" value="Register">
    </form>

</body>
</html>
